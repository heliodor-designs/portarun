[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portarun"
version = "0.1.0"
description = "Restroom / porta-potty locator data pipeline for runners (Greensboro POC)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
potties-fetch = "pipeline.fetch:main"
potties-build = "pipeline.normalize:main"

[tool.setuptools]
packages = ["pipeline", "pipeline.sources"]
